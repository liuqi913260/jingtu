<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>竞途 · 大学生竞赛协作平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">JT</div>
          <div>
            <div class="brand-name">竞途</div>
            <div class="brand-sub">大学生竞赛协作平台</div>
          </div>
        </div>
        <div class="sidebar-label">工作台</div>
        <nav class="main-nav" aria-label="主导航">
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span>首页总览</button>
          <button class="nav-item" data-view="competitions"><span class="nav-icon">◈</span>赛事广场<span class="nav-count">12</span></button>
          <button class="nav-item" data-view="teams"><span class="nav-icon">◎</span>找队友</button>
          <button class="nav-item" data-view="knowledge"><span class="nav-icon">▤</span>知识库</button>
        </nav>
        <div class="sidebar-label second">我的</div>
        <nav class="main-nav">
          <button class="nav-item" data-view="my-posts"><span class="nav-icon">▣</span>我的发布</button>
          <button class="nav-item" data-view="profile"><span class="nav-icon">◉</span>个人资料</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="tip-card">
            <div class="tip-icon">✦</div>
            <div><strong>让热爱找到同路人</strong><p>发布你的比赛，找到合适队友。</p></div>
          </div>
          <div class="user-mini" id="user-mini">
            <div class="avatar">访</div>
            <div class="user-mini-info"><strong>访客用户</strong><span>登录后解锁更多</span></div>
            <button class="more-btn" id="open-login" aria-label="登录">→</button>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>竞途</span><b>/</b><span id="page-label">首页总览</span></div>
          <div class="top-actions">
            <div class="search-box"><span>⌕</span><input id="global-search" placeholder="搜索比赛、知识或队友…" /></div>
            <button class="icon-btn" id="notice-btn" aria-label="通知">♢<i></i></button>
            <button class="primary-btn small" id="header-publish">＋ 发布比赛</button>
          </div>
        </header>

        <div class="page-container" id="view-root"></div>
      </main>
    </div>

    <div class="modal-backdrop hidden" id="modal-backdrop">
      <section class="modal" id="modal" role="dialog" aria-modal="true"></section>
    </div>
    <div class="toast" id="toast"></div>
    <script src="src/core.js"></script>
    <script src="app.js"></script>
  </body>
</html>
